# Deploy Mini App to Telegram — fully automatic, no PC needed.
#
# Trigger: any push to the arena branch that touches frontend/**,
# or manual: GitHub repo -> Actions -> Deploy Mini App -> Run workflow.
#
# What it does:
#   1. Builds the frontend (VITE_API_URL baked in, see env below).
#   2. Pushes it to Telegram static hosting (tgcloud webapp/).
#   3. Points the TEST bot's menu button at ?v=<run number> (fresh, never cached).
#   4. Syncs Render's WEBAPP_URL to the same URL (in-chat buttons + reboot-safe).
#
# One-time setup (5 min, then never again):
#   GitHub repo -> Settings -> Secrets and variables -> Actions -> New secret:
#     TGCLOUD_TOKEN  = CLI token (Telegram -> test bot -> Serverless -> CLI Access)
#     TEST_BOT_TOKEN = test bot API token (@BotFather -> test bot -> API Token)
#   (no Render key needed: the backend adopts the CI-managed menu URL at boot;
#   Render must deploy the arena branch — dashboard -> service -> Settings -> Branch)
#
# NOTE: if the Render service is ever recreated, update RENDER_SERVICE_ID below
# (Render dashboard URL: dashboard.render.com/web-<SERVICE_ID>/...).
# If the API moves off Render, update VITE_API_URL below.

name: Deploy Mini App to Telegram

on:
  push:
    branches: [arena/95f0f2a6-addis-dating]
    paths: ['frontend/**', '.github/workflows/deploy-webapp.yml']
  workflow_dispatch:

env:
  VITE_API_URL: https://addis-dating-test.onrender.com
  WEBAPP_BASE_URL: https://app8948725364.tgcloud.ai/
  RENDER_SERVICE_ID: srv-dbfio10473hc73dbiev0

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@v4
        with:
          ref: arena/95f0f2a6-addis-dating

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install

      - name: Build frontend
        env:
          VITE_BUILD_ID: ci-${{ github.run_number }}
        run: npm run build --workspace frontend

      - name: Stage webapp for tgcloud
        run: |
          rm -rf serverless/webapp
          cp -r frontend/dist serverless/webapp
          RDIR="serverless/webapp/r${{ github.run_number }}"
          mkdir -p "$RDIR"
          cp frontend/dist/index.html "$RDIR/index.html"
          ls serverless/webapp "$RDIR"

      - name: Install tgcloud CLI
        working-directory: serverless
        run: |
          npm install
          npm ls @tgcloud/cli

      - name: Sync tgcloud snapshot
        working-directory: serverless
        env:
          TGCLOUD_TOKEN: ${{ secrets.TGCLOUD_TOKEN }}
        run: |
          export TGCLOUD_TOKEN="$(printf '%s' "$TGCLOUD_TOKEN" | tr -d '[:space:]')"
          npx tgcloud fetch

      - name: Pre-push diagnostics
        working-directory: serverless
        env:
          TGCLOUD_TOKEN: ${{ secrets.TGCLOUD_TOKEN }}
        run: |
          node -e "const t=(process.env.TGCLOUD_TOKEN||''); console.log('token present:', t.length>0, '| raw length:', t.length, '| stripped length:', t.replace(/\\s+/g,'').length)"

      - name: Push to Telegram static hosting
        working-directory: serverless
        env:
          TGCLOUD_TOKEN: ${{ secrets.TGCLOUD_TOKEN }}
        run: |
          export TGCLOUD_TOKEN="$(printf '%s' "$TGCLOUD_TOKEN" | tr -d '[:space:]')"
          echo "::add-mask::$TGCLOUD_TOKEN"
          echo "::notice::cli-version=$(npm ls @tgcloud/cli 2>/dev/null | head -2 | tr '\n' ' ')"
          set +e
          npx tgcloud push > push-output.txt 2>&1
          code=$?
          set -e
          echo "--- push output (token masked) ---"
          cat push-output.txt
          echo "----------------------------------"
          if [ "$code" -ne 0 ]; then
            echo "::error::tgcloud push failed (exit $code): $(head -c 2500 push-output.txt | tr '\n' ' ')"
            exit "$code"
          fi

      - name: Point test-bot menu at fresh URL
        env:
          TEST_BOT_TOKEN: ${{ secrets.TEST_BOT_TOKEN }}
        run: |
          MENU_URL="https://app8948725364.tgcloud.ai/r${{ github.run_number }}/?v=ci-${{ github.run_number }}"
          echo "Menu URL: $MENU_URL"
          echo "::add-mask::$TEST_BOT_TOKEN"
          RESP=$(curl -sS -w "\nHTTP %{http_code}" -X POST "https://api.telegram.org/bot${TEST_BOT_TOKEN}/setChatMenuButton" \
            -H 'Content-Type: application/json' \
            -d "{\"menu_button\":{\"type\":\"web_app\",\"text\":\"💖 Open Dategram\",\"web_app\":{\"url\":\"$MENU_URL\"}}}")
          echo "$RESP"
          echo "$RESP" | grep -q '"ok":true' || { echo "::error::setChatMenuButton failed: $(echo "$RESP" | head -c 1000 | tr '\n' ' ')"; exit 1; }
          echo "MENU_URL=$MENU_URL" >> "$GITHUB_ENV"

      - name: Summary
        run: |
          {
            echo "## :rocket: Mini App deployed"
            echo ""
            echo "Menu button + backend now point at:"
            echo "\`${MENU_URL}\`"
            echo ""
            echo "Reopen the app from the test bot to load it fresh."
          } >> "$GITHUB_STEP_SUMMARY"
