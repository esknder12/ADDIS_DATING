services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: dategram
      POSTGRES_USER: dategram
      POSTGRES_PASSWORD: dategram
    ports:
      - "5432:5432"
    volumes:
      - dategram_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dategram -d dategram"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  dategram_postgres:
