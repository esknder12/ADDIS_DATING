services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: libmatch
      POSTGRES_USER: libmatch
      POSTGRES_PASSWORD: libmatch
    ports:
      - "5432:5432"
    volumes:
      - libmatch_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U libmatch -d libmatch"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  libmatch_postgres:
